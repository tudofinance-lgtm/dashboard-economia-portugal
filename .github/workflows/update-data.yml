name: Update Data Cache

on:
  schedule:
    - cron: '0 7 * * *'   # Daily at 07:00 UTC (08:00 Lisboa hora de verão)
  workflow_dispatch:        # Manual trigger via GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # needed to commit data/cache.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data from APIs
        run: python scripts/fetch_data.py

      - name: Commit and push updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update data cache $(date -u +%Y-%m-%d)"
            git push origin main
          fi
